name: Ludashi 5.0 APK artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "5.0"

permissions:
  contents: write

concurrency:
  group: ludashi-public-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache native shader tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ludashi-ci-tools
          key: native-tools-${{ runner.os }}-${{ hashFiles('.github/scripts/prepare-native-tools.sh') }}
      - name: Prepare native tools without apt
        run: bash .github/scripts/prepare-native-tools.sh
      - name: Validate WFG and disabled frame generation
        run: |
          python3 app/src/main/cpp/winlator/renderer/vulkan/wfg/tests/test_backend.py
          python3 app/src/main/cpp/winlator/renderer/vulkan/wfg/tests/test_direct_output.py
          python3 app/src/main/cpp/winlator/renderer/vulkan/wfg/tests/test_source_snapshot.py
          python3 app/src/main/cpp/winlator/renderer/vulkan/lsfg/tests/test_disabled_path.py
          python3 app/src/main/cpp/winlator/renderer/vulkan/lsfg/tests/test_live_enable.py
      - name: Validate the native X11 core with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S app/src/main/cpp/ludashix11 -B "$RUNNER_TEMP/native-x11-host" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build "$RUNNER_TEMP/native-x11-host" -j2
          "$RUNNER_TEMP/native-x11-host/ludashix11_renderer_test"
          # ... (остальные тесты X11 остаются без изменений) ...
      - name: Test controller waits with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 app/src/main/cpp/winlator/tests/test_fakeinput_wait.py
      - name: Test live controls and magnifier
        run: |
          python3 app/src/main/scripts/test_live_exclusive_focus.py
          python3 app/src/main/scripts/test_magnifier_pan.py

  android-apk:
    needs: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout the test branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache native shader tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ludashi-ci-tools
          key: native-tools-${{ runner.os }}-${{ hashFiles('.github/scripts/prepare-native-tools.sh') }}
      - name: Prepare native tools without apt
        run: bash .github/scripts/prepare-native-tools.sh

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify or build Ludashi Steam launcher
        run: bash .github/scripts/prepare-steam-launcher.sh

      - name: Test native Steam client
        run: cargo test --locked --manifest-path app/src/main/cpp/ludashi-steam-client/rust/Cargo.toml

      - name: Download verified Gradle distribution with fallback
        run: bash .github/scripts/prepare-gradle.sh

      # --- НАША ПОДПИСЬ ВМЕСТО ИХ КЛЮЧЕЙ ---
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/my-release-key.jks

      - name: Run Android tests
        run: >-
          bash gradlew testDebugUnitTest --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          --no-configuration-cache --stacktrace

      - name: Build signed release APK
        run: >-
          bash gradlew assembleRelease --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          --no-configuration-cache --stacktrace
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/my-release-key.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          -Pandroid.injecting.signing.key.alias=${{ secrets.KEY_ALIAS }}
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Report runner resources on failure
        if: failure()
        run: |
          free -h
          df -h
          for path in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max; do
            if [ -r "$path" ]; then
              echo "$path"
              cat "$path"
            fi
          done

      - name: Verify native Steam library is packaged
        run: |
          python3 -c 'import zipfile; z = zipfile.ZipFile("app/build/outputs/apk/release/app-release.apk"); assert not any(n.lower().endswith((".p12", ".pfx", ".jks", ".keystore")) or n.rsplit("/", 1)[-1].lower() == "password.txt" for n in z.namelist()), "Signing files must not be packaged"; assert "lib/arm64-v8a/libludashisteam.so" in z.namelist(); assert b"libludashisteam.so" not in z.read("lib/arm64-v8a/libwinlator.so"), "Steam must not be a dependency of the emulator core"'

      # --- СОЗДАЕМ РЕЛИЗ ВМЕСТО АРХИВА ---
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Winlator 5.0 Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
